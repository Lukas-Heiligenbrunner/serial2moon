# Moonraker config for the serial2moon harness.
# serial2moon emulates Klipper, so Moonraker connects to its socket as if it were klippy.

[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /opt/printer_data/run/klippy.sock

[machine]
# No host management inside the container.
provider: none

[authorization]
trusted_clients:
    0.0.0.0/0
    ::/0
cors_domains:
    *

[file_manager]
enable_object_processing: False

[octoprint_compat]

[history]
