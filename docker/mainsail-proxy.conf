# Proxy Moonraker's API + websocket through the Mainsail nginx, so the browser only
# talks to a single origin. Included by Mainsail via /etc/nginx/extra-conf.d/*.conf.

location /websocket {
    proxy_pass http://moonraker:7125/websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 86400;
}

location ~ ^/(printer|api|access|machine|server)/ {
    proxy_pass http://moonraker:7125$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Scheme $scheme;
    client_max_body_size 1024M;
}
