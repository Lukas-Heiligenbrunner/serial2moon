version: '3.8'

services:
  uart2moon:
    build:
      context: .
      no_cache: true
    container_name: uart2moon
    environment:
      - TEST_MODE=true
      - SOCKET_PATH=/tmp/printer
      - VERBOSE=true
    volumes:
      - printer_socket:/tmp
    networks:
      - printer_network
    restart: unless-stopped

  moonraker:
    image: registry.hub.docker.com/mkuf/moonraker:latest
    container_name: moonraker
    volumes:
      - ./config/moonraker.conf:/opt/printer_data/config/moonraker.conf
      - printer_socket:/tmp
      - moonraker_data:/opt/moonraker/data
      - moonraker_logs:/opt/moonraker/logs
    ports:
      - "7125:7125"
    networks:
      - printer_network
    depends_on:
      - uart2moon
    restart: unless-stopped

  mainsail:
    image: ghcr.io/mainsail-crew/mainsail:latest
    container_name: mainsail
    ports:
      - "8081:80"
    networks:
      - printer_network
    depends_on:
      - moonraker
    restart: unless-stopped

  nginx:
    image: docker.io/nginx:latest
    container_name: nginxprinterproxy
    ports:
      - "8080:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - printer_network
    depends_on:
      - mainsail
      - moonraker
    restart: unless-stopped

volumes:
  printer_socket:
  moonraker_data:
  moonraker_logs:

networks:
  printer_network:
    driver: bridge