name: docker

# Cross-compile the binary for amd64/arm64/armv7 on an amd64 runner (no slow emulated
# compiles), then pack each into a minimal image and push a multi-arch manifest to GHCR.
on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cross-compile static binaries
        run: |
          set -euo pipefail
          # target triple -> docker platform dir
          declare -A T=(
            [x86_64-unknown-linux-musl]=linux/amd64
            [aarch64-unknown-linux-musl]=linux/arm64
            [armv7-unknown-linux-musleabihf]=linux/arm/v7
          )
          for triple in "${!T[@]}"; do
            cross build --release --locked --target "$triple"
            dir="dist/${T[$triple]}"
            mkdir -p "$dir"
            cp "target/$triple/release/serial2moon" "$dir/serial2moon"
          done

      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pack
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
