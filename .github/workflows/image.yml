name: image

# On a published release, bake a flash-and-go Raspberry Pi OS (arm64) image with the
# whole stack pre-installed, and attach the compressed .img to the release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Pre-bake container images (arm64) as loadable tars
        run: |
          set -euo pipefail
          mkdir -p image/files/opt/serial2moon/images
          # serial2moon: cross-compile arm64 via the Dockerfile, export a docker-loadable tar.
          docker buildx build --platform linux/arm64 -f Dockerfile \
            -t serial2moon:bundled \
            -o type=docker,dest=image/files/opt/serial2moon/images/serial2moon.tar .
          # Upstream images: pull the arm64 variant and save.
          docker pull --platform linux/arm64 mkuf/moonraker:latest
          docker pull --platform linux/arm64 ghcr.io/mainsail-crew/mainsail:latest
          docker save mkuf/moonraker:latest        -o image/files/opt/serial2moon/images/moonraker.tar
          docker save ghcr.io/mainsail-crew/mainsail:latest -o image/files/opt/serial2moon/images/mainsail.tar

      - name: Bake Raspberry Pi OS image
        id: build
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite_arm64:latest
          image_additional_mb: 4096
          copy_repository_path: /serial2moon-src
          commands: |
            bash /serial2moon-src/image/provision.sh

      - name: Compress image
        run: |
          mv "${{ steps.build.outputs.image }}" serial2moon-rpi-arm64.img
          xz -T0 -9 serial2moon-rpi-arm64.img

      # Always keep the image as a workflow artifact, so a release-upload hiccup never
      # wastes the (slow) bake — it's downloadable from the run's Artifacts.
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: serial2moon-rpi-arm64
          path: serial2moon-rpi-arm64.img.xz
          retention-days: 7

      - name: Attach image to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: serial2moon-rpi-arm64.img.xz
