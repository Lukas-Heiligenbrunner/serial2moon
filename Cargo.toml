[package]
name = "serial2moon"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bridge that runs Klipper web frontends (Mainsail/Fluidd) on a legacy Marlin printer over USB serial"
repository = "https://github.com/Lukas-Heiligenbrunner/serial2moon"

[dependencies]
anyhow = "1.0.102"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
dotenvy = "0.15.7"
flate2 = "1.1.10"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tokio-serial = "5.4.5"
tokio-util = { version = "0.7.18", features = ["codec"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
nix = { version = "0.31.3", features = ["term"] }

[profile.release]
strip = "debuginfo"  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
lto = true  # Enable link-time optimization.
codegen-units = 1
