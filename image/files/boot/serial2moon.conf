# serial2moon configuration.
# Edit this file (it lives on the boot partition, visible from any PC after flashing),
# then reboot the Pi — or run:  sudo systemctl restart serial2moon
#
# By default serial2moon AUTODETECTS the printer among the connected USB serial devices,
# so you usually don't need to set anything here except the temperature limits.

# Optional: pin a specific serial device instead of autodetecting. Use a stable by-id path
# (find it with:  ls /dev/serial/by-id/ ). Leave empty to autodetect.
SERIAL_DEVICE=""
#SERIAL_DEVICE="/dev/serial/by-id/usb-Prusa_Original_Prusa_i3_MK3_CZPX...-if00"

# Optional: pin the baud rate. Leave empty to autodetect via M115.
SERIAL_BAUD=""

# Firmware temperature limits (°C) — set to match your printer; these bound the UI inputs.
EXTRUDER_MAX_TEMP=300
BED_MAX_TEMP=120
