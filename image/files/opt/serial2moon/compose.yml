# Raspberry Pi appliance stack (prebaked image). Container images are loaded from
# /opt/serial2moon/images/*.tar at boot, so this runs fully offline.
#
# This is a REAL printer appliance: serial2moon always runs in serial mode and
# autodetects the printer among the connected USB serial devices. If no printer is
# connected it reports an error and keeps retrying (no mock/demo mode here).

services:
  serial2moon:
    image: serial2moon:bundled
    # Mainsail shows Klipper's printer.info.hostname (this container's hostname) as the
    # printer name; default it to the Pi's hostname (set by start.sh) vs the container id.
    hostname: ${PRINTER_NAME:-serial2moon}
    depends_on:
      - moonraker # let Moonraker initialize the shared volumes first
    user: "1000:1000"
    group_add:
      - "20" # 'dialout' gid on Raspberry Pi OS — needed to open the serial port
    env_file:
      - .env
    environment:
      - S2M_TRANSPORT=serial
      - S2M_UDS=/opt/printer_data/run/klippy.sock
      - S2M_GCODE_DIR=/opt/printer_data/gcodes
      - S2M_LOG_DIR=/opt/printer_data/logs
    volumes:
      - comms:/opt/printer_data/run
      - gcodes:/opt/printer_data/gcodes
      - logs:/opt/printer_data/logs
      - /dev:/dev # expose all serial devices (and survive hotplug/replug)
    device_cgroup_rules:
      - "c 188:* rmw" # USB serial (ttyUSB*)
      - "c 166:* rmw" # USB CDC ACM (ttyACM*)
    restart: unless-stopped

  moonraker:
    image: mkuf/moonraker:latest
    # Mainsail shows Moonraker's hostname as the printer name; default it to the Pi's
    # hostname (set start.sh-side) instead of the random container id.
    hostname: ${PRINTER_NAME:-serial2moon}
    volumes:
      - comms:/opt/printer_data/run
      - gcodes:/opt/printer_data/gcodes
      - logs:/opt/printer_data/logs
      - ./docker/moonraker.conf:/opt/printer_data/config/moonraker.conf:ro
    ports:
      - "7125:7125"
    restart: unless-stopped

  mainsail:
    image: ghcr.io/mainsail-crew/mainsail:latest
    depends_on:
      - moonraker
    ports:
      - "80:80"
    volumes:
      - ./docker/mainsail-proxy.conf:/etc/nginx/extra-conf.d/moonraker.conf:ro
    restart: unless-stopped

volumes:
  comms:
  gcodes:
  logs:
