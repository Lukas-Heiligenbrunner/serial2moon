# Raspberry Pi appliance stack (prebaked image). Container images are loaded from
# /opt/serial2moon/images/*.tar at boot, so this runs fully offline.
#
# serial vs mock is selected via .env (generated by start.sh from /boot/.../serial2moon.conf):
#   S2M_TRANSPORT=mock         -> simulated printer (default, no hardware)
#   S2M_TRANSPORT=serial       -> real printer; compose.serial.yml override adds the device

services:
  serial2moon:
    image: serial2moon:bundled
    depends_on:
      - moonraker            # let Moonraker initialize the shared volumes first
    user: "1000:1000"
    env_file:
      - .env
    environment:
      - S2M_UDS=/opt/printer_data/run/klippy.sock
      - S2M_GCODE_DIR=/opt/printer_data/gcodes
      - RUST_LOG=info
    volumes:
      - comms:/opt/printer_data/run
      - gcodes:/opt/printer_data/gcodes
    restart: unless-stopped

  moonraker:
    image: mkuf/moonraker:latest
    volumes:
      - comms:/opt/printer_data/run
      - gcodes:/opt/printer_data/gcodes
      - ./docker/moonraker.conf:/opt/printer_data/config/moonraker.conf:ro
    ports:
      - "7125:7125"
    restart: unless-stopped

  mainsail:
    image: ghcr.io/mainsail-crew/mainsail:latest
    depends_on:
      - moonraker
    ports:
      - "80:80"
    volumes:
      - ./docker/mainsail-proxy.conf:/etc/nginx/extra-conf.d/moonraker.conf:ro
    restart: unless-stopped

volumes:
  comms:
  gcodes:
