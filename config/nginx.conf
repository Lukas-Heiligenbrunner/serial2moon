map $http_upgrade $connection_upgrade {
           default upgrade;
           ''      close;
       }

server {
    listen 80 default_server;
    # listen [::]:80 default_server; # Uncomment for IPv6

    access_log /var/log/nginx/mainsail-access.log;
    error_log /var/log/nginx/mainsail-error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_proxied expired no-cache no-store private auth;
    gzip_comp_level 4;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml;

    root /home/pi/mainsail;
    index index.html;
    server_name _;

    client_max_body_size 0;
    proxy_request_buffering off;

    # Serve static assets from mainsail container
    location / {
        proxy_pass http://mainsail:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        proxy_pass http://mainsail:80/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Proxy websocket requests to moonraker
    location /websocket {
        proxy_pass http://moonraker:7125/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Proxy Moonraker API requests
    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://moonraker:7125$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
    }
}